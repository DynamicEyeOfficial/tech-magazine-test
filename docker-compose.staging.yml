services:
  app:
    build: .
    command: node server.js
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    environment:
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
    volumes:
      - tech-staging-data:/app/data
      - tech-staging-uploads:/app/public/uploads
      - tech-staging-backups:/app/backups
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    command: node worker.js
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - tech-staging-data:/app/data
      - tech-staging-uploads:/app/public/uploads
      - tech-staging-backups:/app/backups
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tech_magazine
      POSTGRES_USER: tech_magazine
      POSTGRES_PASSWORD: change_this_staging_password
    volumes:
      - tech-staging-postgres:/var/lib/postgresql/data
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tech_magazine -d tech_magazine"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - tech-staging-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/tech-magazine-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  tech-staging-data:
  tech-staging-uploads:
  tech-staging-backups:
  tech-staging-postgres:
  tech-staging-redis:
