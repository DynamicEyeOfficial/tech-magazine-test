apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tech-magazine-data
  namespace: tech-magazine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tech-magazine-uploads
  namespace: tech-magazine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
